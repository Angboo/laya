name: Evals

# The real-checkpoint quality gate. It downloads weights and the MASSIVE dataset, so it is kept
# out of PR CI: it runs weekly, before a release, and on demand, and compares the fresh numbers
# to the committed baseline in research/results/. A failure is a regression in the published
# numbers, not a blocked PR.
on:
  schedule:
    - cron: "0 3 * * 1"       # Mondays 03:00 UTC
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Nothing here runs on a pull request, so there is no obsolete run for a concurrency group to
# throw away. All three triggers used to share `evals-${{ github.ref }}` with
# `cancel-in-progress: true`, so whichever started second killed the first: a manual re-run
# cancelled the weekly baseline, and the `release: published` gate could be cancelled by a
# dispatch that started a minute earlier. The job spends 60 minutes downloading weights and the
# dataset, and a cancelled run uploads no report, so the cancellation reads as a clean gate.
# One group per run lets every trigger report.
concurrency:
  group: evals-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  english-regression:
    name: English checkpoint vs committed baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . datasets

      - name: Evaluate the English checkpoint on MASSIVE English
        run: |
          python research/eval/laya_eval.py \
            --model convaiinnovations/laya --langs en --out report.json

      - name: Compare to the committed baseline
        run: |
          python research/evals/check_regression.py report.json \
            research/results/eval_english_51_languages.json \
            research/evals/thresholds.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-report
          path: report.json
          if-no-files-found: ignore
